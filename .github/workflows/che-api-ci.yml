name: Che API CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  api-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: che
          POSTGRES_USER: che
          POSTGRES_PASSWORD: che_demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U che -d che"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://che:che_demo@127.0.0.1:5432/che

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API dependencies
        working-directory: apps/api
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Apply Alembic migration
        working-directory: apps/api
        run: alembic upgrade head

      - name: Load demo data
        working-directory: apps/api
        run: python -m app.seeds

      - name: Run automated tests
        working-directory: apps/api
        run: pytest -q

      - name: Start FastAPI
        working-directory: apps/api
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 >/tmp/che-api.log 2>&1 &
          echo $! >/tmp/che-api.pid

      - name: Wait for API health
        run: |
          python - <<'PY'
          import time
          import urllib.request
          for _ in range(30):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=2) as response:
                      if response.status == 200:
                          print("API ready")
                          raise SystemExit(0)
              except Exception:
                  time.sleep(1)
          raise SystemExit("FastAPI did not become ready")
          PY

      - name: Verify full database flow
        working-directory: apps/api
        run: python scripts/verify_demo_flow.py

      - name: Print API logs if something fails
        if: failure()
        run: cat /tmp/che-api.log || true
